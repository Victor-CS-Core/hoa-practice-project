name: Transfer Master Admin

# One-shot ops: deploy the current main BFF artifact with a non-committed
# MasterAdminBootstrap replace key, transfer sole master admin to the account in
# BOOTSTRAP_ADMIN_* secrets, then redeploy the clean artifact (key removed).

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: hoa-bff-production
  cancel-in-progress: false

jobs:
  transfer:
    name: Transfer Sole Master Admin
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    permissions:
      actions: read
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate publish profile identity
        shell: bash
        env:
          APP_NAME: ${{ secrets.AZURE_WEBAPP_NAME_PRODUCTION }}
          PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_PRODUCTION }}
        run: |
          set -euo pipefail
          python3 scripts/validate_azure_publish_profile.py

      - name: Resolve trusted CI artifact for current main
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          deploy_sha=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')
          runs_file="$RUNNER_TEMP/ci-runs.json"
          gh api --method GET "repos/$GH_REPO/actions/workflows/ci.yml/runs" \
            -f head_sha="$deploy_sha" \
            -f branch=main \
            -f event=push \
            -f status=success \
            -f per_page=100 > "$runs_file"
          ci_run_id=$(jq -r --arg repo "$GH_REPO" --arg sha "$deploy_sha" '
            [.workflow_runs[] |
              select(.head_sha == $sha and
                     .head_branch == "main" and
                     .event == "push" and
                     .conclusion == "success" and
                     .head_repository.full_name == $repo)] |
            sort_by(.run_number) | last | .id // empty
          ' "$runs_file")
          if ! [[ "$ci_run_id" =~ ^[0-9]+$ ]]; then
            echo "::error::No successful push CI run for current main ($deploy_sha)."
            exit 1
          fi
          echo "deploy_sha=$deploy_sha" >> "$GITHUB_OUTPUT"
          echo "ci_run_id=$ci_run_id" >> "$GITHUB_OUTPUT"

      - name: Download exact CI artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: hoa-bff-${{ steps.release.outputs.deploy_sha }}
          path: ${{ runner.temp }}/hoa-bff-artifact
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.release.outputs.ci_run_id }}

      - name: Extract publish package
        id: package
        shell: bash
        env:
          DEPLOY_SHA: ${{ steps.release.outputs.deploy_sha }}
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/hoa-bff-artifact"
          archive_name="hoa-bff-${DEPLOY_SHA}.tar.gz"
          test -f "$artifact_dir/$archive_name"
          test -f "$artifact_dir/$archive_name.sha256"
          (
            cd "$artifact_dir"
            sha256sum --check --strict "$archive_name.sha256"
          )
          publish_dir="$RUNNER_TEMP/hoa-bff-publish"
          mkdir -p "$publish_dir"
          tar -xzf "$artifact_dir/$archive_name" -C "$publish_dir"
          test -f "$publish_dir/HoaCommunityEvents.API.dll"
          test -f "$publish_dir/wwwroot/index.html"
          echo "publish_dir=$publish_dir" >> "$GITHUB_OUTPUT"

      - name: Inject one-shot replace key
        id: key
        shell: bash
        env:
          PUBLISH_DIR: ${{ steps.package.outputs.publish_dir }}
        run: |
          set -euo pipefail
          replace_key="$(openssl rand -hex 32)"
          echo "::add-mask::$replace_key"
          REPLACE_KEY="$replace_key" PUBLISH_DIR="$PUBLISH_DIR" python3 - <<'PY'
          import json, os
          key = os.environ["REPLACE_KEY"]
          publish_dir = os.environ["PUBLISH_DIR"]

          # Primary: merge into Production settings (always loaded by the host).
          production_path = os.path.join(publish_dir, "appsettings.Production.json")
          with open(production_path, encoding="utf-8") as handle:
              production = json.load(handle)
          production["MasterAdminBootstrap"] = {"ReplaceKey": key}
          with open(production_path, "w", encoding="utf-8") as handle:
              json.dump(production, handle, indent=2)
              handle.write("\n")

          # Secondary overlay (also loaded explicitly in Program.cs).
          bootstrap_path = os.path.join(publish_dir, "appsettings.Bootstrap.json")
          with open(bootstrap_path, "w", encoding="utf-8") as handle:
              json.dump({"MasterAdminBootstrap": {"ReplaceKey": key}}, handle)

          # Tertiary: plain key file read by AccountController as a last resort.
          key_path = os.path.join(publish_dir, "master-bootstrap.key")
          with open(key_path, "w", encoding="utf-8") as handle:
              handle.write(key)

          print(f"Injected ReplaceKey into {production_path}, {bootstrap_path}, and {key_path}")
          PY
          echo "replace_key=$replace_key" >> "$GITHUB_OUTPUT"

      - name: Deploy package with replace key
        id: deploy_keyed
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME_PRODUCTION }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_PRODUCTION }}
          package: ${{ steps.package.outputs.publish_dir }}

      - name: Transfer master admin via bootstrap API
        shell: bash
        env:
          WEBAPP_URL: ${{ steps.deploy_keyed.outputs.webapp-url }}
          REPLACE_KEY: ${{ steps.key.outputs.replace_key }}
          ADMIN_EMAIL: ${{ secrets.BOOTSTRAP_ADMIN_EMAIL }}
          ADMIN_USERNAME: ${{ secrets.BOOTSTRAP_ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.BOOTSTRAP_ADMIN_PASSWORD }}
          ADMIN_DISPLAY_NAME: ${{ secrets.BOOTSTRAP_ADMIN_DISPLAY_NAME }}
        run: |
          set -euo pipefail
          for required in WEBAPP_URL REPLACE_KEY ADMIN_EMAIL ADMIN_USERNAME ADMIN_PASSWORD ADMIN_DISPLAY_NAME; do
            if [ -z "${!required}" ]; then
              echo "::error::Missing required secret/env: $required"
              exit 1
            fi
          done
          echo "::add-mask::$ADMIN_PASSWORD"
          echo "::add-mask::$REPLACE_KEY"

          base_url="${WEBAPP_URL%/}"
          for _ in $(seq 1 24); do
            if curl --fail --silent --show-error --output /dev/null "$base_url/health"; then
              break
            fi
            sleep 5
          done
          curl --fail-with-body --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 \
            --output /dev/null "$base_url/health"

          # Confirm the keyed build is live (replace without key must still 409).
          jar="$(mktemp)"
          csrf="$(curl -fsS -c "$jar" -b "$jar" "$base_url/api/security/csrf")"
          token="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["requestToken"])' <<<"$csrf")"
          payload="$(python3 -c 'import json,os; print(json.dumps({
            "email": os.environ["ADMIN_EMAIL"],
            "username": os.environ["ADMIN_USERNAME"],
            "password": os.environ["ADMIN_PASSWORD"],
            "displayName": os.environ["ADMIN_DISPLAY_NAME"],
          }))')"
          code="$(curl -sS -o /tmp/hoa-bootstrap.json -w '%{http_code}' -X POST "$base_url/api/account/bootstrap-master-admin" \
            -H 'Content-Type: application/json' \
            -H "X-CSRF-TOKEN: $token" \
            -H "X-Master-Bootstrap-Key: $REPLACE_KEY" \
            -b "$jar" -c "$jar" \
            --data-binary "$payload")"
          if [ "$code" != "200" ]; then
            echo "::error::Master admin transfer failed with HTTP $code"
            python3 -c 'import json; print(json.load(open("/tmp/hoa-bootstrap.json")))' || cat /tmp/hoa-bootstrap.json || true
            exit 1
          fi
          echo "Master admin transfer succeeded."

      - name: Restore clean Production settings in package
        shell: bash
        env:
          PUBLISH_DIR: ${{ steps.package.outputs.publish_dir }}
        run: |
          set -euo pipefail
          rm -f "$PUBLISH_DIR/appsettings.Bootstrap.json" "$PUBLISH_DIR/master-bootstrap.key"
          PUBLISH_DIR="$PUBLISH_DIR" python3 - <<'PY'
          import json, os
          path = os.path.join(os.environ["PUBLISH_DIR"], "appsettings.Production.json")
          with open(path, encoding="utf-8") as handle:
              production = json.load(handle)
          production.pop("MasterAdminBootstrap", None)
          with open(path, "w", encoding="utf-8") as handle:
              json.dump(production, handle, indent=2)
              handle.write("\n")
          print(f"Cleaned {path}")
          PY
          test ! -f "$PUBLISH_DIR/appsettings.Bootstrap.json"
          test ! -f "$PUBLISH_DIR/master-bootstrap.key"

      - name: Redeploy clean package without replace key
        id: deploy_clean
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME_PRODUCTION }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_PRODUCTION }}
          package: ${{ steps.package.outputs.publish_dir }}

      - name: Verify master admin can sign in
        shell: bash
        env:
          WEBAPP_URL: ${{ steps.deploy_clean.outputs.webapp-url }}
          ADMIN_EMAIL: ${{ secrets.BOOTSTRAP_ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.BOOTSTRAP_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          echo "::add-mask::$ADMIN_PASSWORD"
          base_url="${WEBAPP_URL%/}"
          for _ in $(seq 1 24); do
            if curl --fail --silent --show-error --output /dev/null "$base_url/health"; then
              break
            fi
            sleep 5
          done
          jar="$(mktemp)"
          csrf="$(curl -fsS -c "$jar" -b "$jar" "$base_url/api/security/csrf")"
          token="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["requestToken"])' <<<"$csrf")"
          code="$(curl -sS -o /tmp/hoa-login.json -w '%{http_code}' -X POST "$base_url/api/account/login" \
            -H 'Content-Type: application/json' \
            -H "X-CSRF-TOKEN: $token" \
            -b "$jar" -c "$jar" \
            --data-binary @<(python3 -c 'import json,os; print(json.dumps({"email":os.environ["ADMIN_EMAIL"],"password":os.environ["ADMIN_PASSWORD"]}))'))"
          if [ "$code" != "200" ]; then
            echo "::error::Login verification failed with HTTP $code"
            python3 -c 'import json; print(json.load(open("/tmp/hoa-login.json")))' || true
            exit 1
          fi
          role="$(python3 -c 'import json; print(json.load(open("/tmp/hoa-login.json")).get("role",""))')"
          email="$(python3 -c 'import json; print(json.load(open("/tmp/hoa-login.json")).get("email",""))')"
          if [ "$role" != "hoa_admin" ]; then
            echo "::error::Expected hoa_admin role, got: $role"
            exit 1
          fi
          if [ "$email" != "$ADMIN_EMAIL" ]; then
            echo "::error::Login email mismatch."
            exit 1
          fi
          echo "Master admin login verified."
