name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

"on":
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: HoaCommunityEvents/frontend/package-lock.json

      - name: Validate production workflow contract
        run: node scripts/validate-production-workflow.mjs

      - name: Validate workflow syntax with actionlint
        shell: bash
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          install_dir="$RUNNER_TEMP/actionlint-${ACTIONLINT_VERSION}"
          curl --fail --location --silent --show-error \
            --output "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  $archive" | sha256sum --check --strict
          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir"
          "$install_dir/actionlint" -color \
            .github/workflows/ci.yml \
            .github/workflows/deploy-api-azure.yml

      - name: Restore
        run: dotnet restore HoaCommunityEvents/backend/HoaCommunityEvents.slnx

      - name: Build
        run: dotnet build HoaCommunityEvents/backend/HoaCommunityEvents.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test HoaCommunityEvents/backend/HoaCommunityEvents.slnx --configuration Release --no-build

      - name: Publish combined BFF
        run: dotnet publish HoaCommunityEvents/backend/src/API/HoaCommunityEvents.API.csproj --configuration Release --no-restore --output "$RUNNER_TEMP/hoa-bff-publish"

      - name: Verify combined package
        shell: bash
        run: |
          test -f "$RUNNER_TEMP/hoa-bff-publish/HoaCommunityEvents.API.dll"
          test -f "$RUNNER_TEMP/hoa-bff-publish/wwwroot/index.html"

      - name: Package SHA-addressed combined BFF artifact
        shell: bash
        env:
          ARTIFACT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/hoa-bff-artifact"
          archive_name="hoa-bff-${ARTIFACT_SHA}.tar.gz"
          mkdir -p "$artifact_dir"
          tar -C "$RUNNER_TEMP/hoa-bff-publish" -czf "$artifact_dir/$archive_name" .
          (
            cd "$artifact_dir"
            sha256sum "$archive_name" > "$archive_name.sha256"
          )

      - name: Upload SHA-addressed combined BFF artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hoa-bff-${{ github.sha }}
          path: ${{ runner.temp }}/hoa-bff-artifact
          if-no-files-found: error
          retention-days: 30

  frontend:
    name: Frontend Lint and Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: HoaCommunityEvents/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: HoaCommunityEvents/frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build
