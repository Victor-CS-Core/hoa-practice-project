name: Deploy HOA BFF to Azure App Service

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

"on":
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: hoa-bff-production
  queue: max
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Combined BFF
    environment:
      name: production
    # workflow_run is privileged: never deploy code from PRs or forks.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      SLOT_NAME: ${{ vars.AZURE_WEBAPP_SLOT_NAME_PRODUCTION }}
      MIGRATION_MODE: ${{ vars.PRODUCTION_MIGRATION_MODE }}

    steps:
      - name: Verify tested main commit
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          current_main=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')
          if [ "$DEPLOY_SHA" != "$current_main" ]; then
            echo "::error::This run is stale. Deploy the current main commit after its CI succeeds."
            exit 1
          fi

          successful_runs=$(gh api --method GET "repos/$GH_REPO/actions/workflows/ci.yml/runs" \
            -f head_sha="$DEPLOY_SHA" -f branch=main -f event=push -f status=success --jq '.total_count')
          if ! [[ "$successful_runs" =~ ^[0-9]+$ ]] || [ "$successful_runs" -lt 1 ]; then
            echo "::error::The selected main commit must pass CI before deployment, including manual runs."
            exit 1
          fi

      - name: Validate deployment configuration
        shell: bash
        env:
          APP_NAME: ${{ secrets.AZURE_WEBAPP_NAME_PRODUCTION }}
          PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_PRODUCTION }}
          SQL_CONNECTION: ${{ secrets.AZURE_SQL_CONNECTION_STRING_PRODUCTION }}
        run: |
          if [ -z "$APP_NAME" ] || [ -z "$PUBLISH_PROFILE" ]; then
            echo "::error::Configure AZURE_WEBAPP_NAME_PRODUCTION and AZURE_WEBAPP_PUBLISH_PROFILE_PRODUCTION."
            exit 1
          fi

          slot_name_canonical="${SLOT_NAME//[[:space:]]/}"
          if [ -z "$slot_name_canonical" ]; then
            echo "::error::Configure AZURE_WEBAPP_SLOT_NAME_PRODUCTION with a non-production staging slot."
            exit 1
          fi

          slot_name_canonical_lower="${slot_name_canonical,,}"
          if [ "$slot_name_canonical_lower" = "production" ]; then
            echo "::error::AZURE_WEBAPP_SLOT_NAME_PRODUCTION must name a non-production staging slot."
            exit 1
          fi

          printf 'SLOT_NAME_CANONICAL=%s\n' "$slot_name_canonical" >> "$GITHUB_ENV"

          if [ "$MIGRATION_MODE" != "workflow" ] && [ "$MIGRATION_MODE" != "external" ]; then
            echo "::error::PRODUCTION_MIGRATION_MODE must be either workflow or external."
            exit 1
          fi

          if [ "$MIGRATION_MODE" = "workflow" ] && [ -z "$SQL_CONNECTION" ]; then
            echo "::error::AZURE_SQL_CONNECTION_STRING_PRODUCTION is required when PRODUCTION_MIGRATION_MODE is workflow."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: HoaCommunityEvents/frontend/package-lock.json

      - name: Publish combined BFF
        run: dotnet publish HoaCommunityEvents/backend/src/API/HoaCommunityEvents.API.csproj -c Release -o "$RUNNER_TEMP/hoa-bff-publish"

      - name: Verify combined package
        shell: bash
        run: |
          test -f "$RUNNER_TEMP/hoa-bff-publish/HoaCommunityEvents.API.dll"
          test -f "$RUNNER_TEMP/hoa-bff-publish/wwwroot/index.html"

      - name: Optionally apply database migrations
        if: ${{ vars.PRODUCTION_MIGRATION_MODE == 'workflow' }}
        shell: bash
        env:
          SQL_CONNECTION: ${{ secrets.AZURE_SQL_CONNECTION_STRING_PRODUCTION }}
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.8
          export PATH="$PATH:/home/runner/.dotnet/tools"
          dotnet ef database update -p HoaCommunityEvents/backend/src/Persistence -s HoaCommunityEvents/backend/src/API --connection "$SQL_CONNECTION"

      - name: Record external migration responsibility
        if: ${{ vars.PRODUCTION_MIGRATION_MODE == 'external' }}
        run: echo "Database migration is an approved external release gate." >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve combined release artifact
        uses: actions/upload-artifact@v4
        with:
          name: hoa-bff-${{ env.DEPLOY_SHA }}
          path: ${{ runner.temp }}/hoa-bff-publish
          if-no-files-found: error
          retention-days: 30

      - name: Deploy to Azure staging slot
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME_PRODUCTION }}
          slot-name: ${{ env.SLOT_NAME_CANONICAL }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_PRODUCTION }}
          package: ${{ runner.temp }}/hoa-bff-publish

      - name: Smoke test staged combined BFF
        shell: bash
        env:
          WEBAPP_URL: ${{ steps.deploy.outputs.webapp-url }}
        run: |
          if [ -z "$WEBAPP_URL" ]; then
            echo "::error::Azure deploy action did not provide the staged webapp URL."
            exit 1
          fi

          base_url="${WEBAPP_URL%/}"
          health_status=$(curl --fail-with-body --silent --show-error \
            --retry 12 --retry-all-errors --retry-delay 5 \
            --output /dev/null --write-out '%{http_code}' "$base_url/health")
          if [ "$health_status" != "200" ]; then
            echo "::error::Staged /health endpoint did not return HTTP 200."
            exit 1
          fi

          require_html() {
            local endpoint="$1"
            local response_file
            local status
            response_file=$(mktemp)
            status=$(curl --fail-with-body --silent --show-error \
              --retry 3 --retry-all-errors --retry-delay 3 \
              --output "$response_file" --write-out '%{http_code}' "$base_url$endpoint")
            if [ "$status" != "200" ] || ! grep -qi '<!doctype html' "$response_file"; then
              rm -f "$response_file"
              echo "::error::Staged $endpoint endpoint did not return HTTP 200 HTML."
              exit 1
            fi
            rm -f "$response_file"
          }

          require_html "/"
          require_html "/events/release-readiness-check"

          csrf_status=$(curl --fail-with-body --silent --show-error \
            --retry 3 --retry-all-errors --retry-delay 3 \
            --output /dev/null --write-out '%{http_code}' "$base_url/api/security/csrf")
          if [ "$csrf_status" != "200" ]; then
            echo "::error::Staged /api/security/csrf endpoint did not return HTTP 200."
            exit 1
          fi
