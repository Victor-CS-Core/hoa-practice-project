name: Deploy API to Azure App Service

"on":
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy API
    runs-on: ubuntu-latest
    env:
      APP_NAME: ${{ secrets[format('{0}', 'AZURE_WEBAPP_NAME_PRODUCTION')] }}
      PUBLISH_PROFILE: ${{ secrets[format('{0}', 'AZURE_WEBAPP_PUBLISH_PROFILE_PRODUCTION')] }}
      SQL_CONNECTION: ${{ secrets[format('{0}', 'AZURE_SQL_CONNECTION_STRING_PRODUCTION')] }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish API
        run: dotnet publish HoaCommunityEvents/API/HoaCommunityEvents.API.csproj -c Release -o ${{ github.workspace }}/api-publish

      - name: Optionally apply database migrations
        shell: bash
        run: |
          if [ -z "$SQL_CONNECTION" ]; then
            echo "No SQL connection secret configured. Skipping migrations."
            exit 0
          fi

          dotnet tool install --global dotnet-ef --version 10.0.8
          export PATH="$PATH:/home/runner/.dotnet/tools"
          dotnet ef database update -p HoaCommunityEvents/Persistence -s HoaCommunityEvents/API --connection "$SQL_CONNECTION"

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP_NAME }}
          publish-profile: ${{ env.PUBLISH_PROFILE }}
          package: ${{ github.workspace }}/api-publish
