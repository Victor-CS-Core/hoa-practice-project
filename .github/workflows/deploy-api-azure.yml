name: Deploy HOA BFF to Azure App Service

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

"on":
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Combined BFF
    runs-on: ubuntu-latest
    env:
      APP_NAME: ${{ secrets.AZURE_WEBAPP_NAME_PRODUCTION }}
      PUBLISH_PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_PRODUCTION }}
      SQL_CONNECTION: ${{ secrets.AZURE_SQL_CONNECTION_STRING_PRODUCTION }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: HoaCommunityEvents/frontend/package-lock.json

      - name: Publish combined BFF
        run: dotnet publish HoaCommunityEvents/backend/src/API/HoaCommunityEvents.API.csproj -c Release -o ${{ github.workspace }}/bff-publish

      - name: Optionally apply database migrations
        shell: bash
        run: |
          if [ -z "$SQL_CONNECTION" ]; then
            echo "No SQL connection secret configured. Skipping migrations."
            exit 0
          fi

          dotnet tool install --global dotnet-ef --version 10.0.8
          export PATH="$PATH:/home/runner/.dotnet/tools"
          dotnet ef database update -p HoaCommunityEvents/backend/src/Persistence -s HoaCommunityEvents/backend/src/API --connection "$SQL_CONNECTION"

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP_NAME }}
          publish-profile: ${{ env.PUBLISH_PROFILE }}
          package: ${{ github.workspace }}/bff-publish
