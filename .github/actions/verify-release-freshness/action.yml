name: Verify Release Freshness
description: Revalidate current main and the exact trusted CI run without mutating release state.

inputs:
  deploy-sha:
    description: Exact release commit SHA selected by the prepare job.
    required: true
  ci-run-id:
    description: Exact successful CI run selected by the prepare job.
    required: true
  repository:
    description: Repository expected to own the commit and CI run.
    required: true
  token:
    description: Scoped GitHub token used only for read-only API calls.
    required: true

runs:
  using: composite
  steps:
    - name: Verify current main and trusted CI run
      shell: bash
      env:
        DEPLOY_SHA: ${{ inputs.deploy-sha }}
        CI_RUN_ID: ${{ inputs.ci-run-id }}
        REPOSITORY: ${{ inputs.repository }}
        GH_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail
        if [ -z "$DEPLOY_SHA" ] || [ -z "$CI_RUN_ID" ] || [ -z "$REPOSITORY" ] || [ -z "$GH_TOKEN" ]; then
          echo "::error::Release freshness verification requires every action input."
          exit 1
        fi

        current_main=$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq '.object.sha')
        if [ "$DEPLOY_SHA" != "$current_main" ]; then
          echo "::error::The approved release is stale relative to main."
          exit 1
        fi

        run_file="$RUNNER_TEMP/release-freshness-ci-run.json"
        gh api "repos/$REPOSITORY/actions/runs/$CI_RUN_ID" > "$run_file"
        if ! jq -e --arg repo "$REPOSITORY" --arg sha "$DEPLOY_SHA" '
          .head_sha == $sha and
          .head_branch == "main" and
          .event == "push" and
          .conclusion == "success" and
          .head_repository.full_name == $repo and
          (.path | startswith(".github/workflows/ci.yml"))
        ' "$run_file" > /dev/null; then
          echo "::error::The approved release no longer matches the trusted CI run."
          exit 1
        fi

        echo "Release freshness verified for $DEPLOY_SHA."
